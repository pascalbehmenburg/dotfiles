# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                    Autostart Configuration                  ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

source = ~/.config/hypr/config/defaults.conf

# Autostart wiki https://wiki.hyprland.org/0.45.0/Configuring/Keywords/#executing #

exec-once = ~/.config/hypr/scripts/theme wallpaper
exec-once = waybar &
exec-once = fcitx5 -d &
exec-once = swaync &
exec-once = nm-applet --indicator &
# Audio effects (bass boost on output, noise reduction on the mic). Service
# mode runs the pipeline without opening the window.
exec-once = easyeffects --service-mode &
exec-once = bash -c "mkfifo /tmp/$HYPRLAND_INSTANCE_SIGNATURE.wob && tail -f /tmp/$HYPRLAND_INSTANCE_SIGNATURE.wob | wob -c ~/.config/hypr/wob.ini & disown" &
exec-once = /usr/lib/polkit-kde-authentication-agent-1 &

# ## Slow app launch fix
exec-once = systemctl --user import-environment &
exec-once = hash dbus-update-activation-environment 2>/dev/null &
exec-once = dbus-update-activation-environment --systemd &

# ## Idle configuration
exec-once = $idlehandler

# Keep workspaces pinned to their home monitor (fixes apps landing on the laptop
# screen at login before the external display has registered).
exec-once = ~/.config/hypr/config/handle_monitor_connect.sh &

# Launches my daily apps on their usual workspace on startup. Runs through a
# helper that waits for the ultrawide so apps land on it instead of the laptop.
exec-once = ~/.config/hypr/config/autostart-apps.sh &
