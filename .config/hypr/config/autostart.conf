# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                    Autostart Configuration                  ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

source = ~/.config/hypr/config/defaults.conf

# Autostart wiki https://wiki.hyprland.org/0.45.0/Configuring/Keywords/#executing #

exec-once = swaybg -o \* -i ~/repos/dotfiles/desktop.webp -m fill
exec-once = waybar &
exec-once = fcitx5 -d &
exec-once = mako &
exec-once = nm-applet --indicator &
exec-once = bash -c "mkfifo /tmp/$HYPRLAND_INSTANCE_SIGNATURE.wob && tail -f /tmp/$HYPRLAND_INSTANCE_SIGNATURE.wob | wob -c ~/.config/hypr/wob.ini & disown" &
exec-once = /usr/lib/polkit-kde-authentication-agent-1 &

# ## Slow app launch fix
exec-once = systemctl --user import-environment &
exec-once = hash dbus-update-activation-environment 2>/dev/null &
exec-once = dbus-update-activation-environment --systemd &

# ## Idle configuration
exec-once = $idlehandler

# launches my daily apps on their usual workspace on startup
exec-once = [workspace 1 silent] zen-browser
exec-once = [workspace 2 silent] alacritty --working-directory /home/pascal/repos/core -e claude --allow-dangerously-skip-permissions
exec-once = [workspace 2 silent] alacritty --working-directory /home/pascal/repos/core -e claude --allow-dangerously-skip-permissions
exec-once = [workspace 2 silent] alacritty --working-directory /home/pascal/repos/core -e claude --allow-dangerously-skip-permissions
exec-once = [workspace 3 silent] obsidian
exec-once = [workspace 3 silent] alacritty --working-directory /home/pascal/repos/core -e lazygit
exec-once = [workspace 4 silent] betterbird
exec-once = [workspace 5 silent] discord
exec-once = [workspace 8 silent] bitwarden
