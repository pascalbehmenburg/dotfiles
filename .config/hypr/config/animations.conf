# ┃                    Animations Configuration                 ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

# https://wiki.hyprland.org/Configuring/Animations/
# Short ease-out curves, no overshoot. Speed is in 100ms units.

animations {
    enabled = true

    bezier = easeOut, 0.22, 1, 0.36, 1
    bezier = easeInOut, 0.65, 0, 0.35, 1
    bezier = linear, 0, 0, 1, 1

    animation = global, 1, 4, easeOut
    animation = windowsIn, 1, 3.5, easeOut, popin 92%
    animation = windowsOut, 1, 2.5, easeInOut, popin 92%
    animation = windowsMove, 1, 4, easeOut, slide
    animation = fade, 1, 3, easeOut
    animation = fadeLayersIn, 1, 2.5, easeOut
    animation = fadeLayersOut, 1, 2, easeInOut
    animation = layers, 1, 3, easeOut, fade
    animation = border, 1, 4, linear
    animation = workspaces, 1, 4, easeOut, slidefade 12%
}
