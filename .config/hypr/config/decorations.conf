# ┃                    Decorations Configuration                ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

source = ~/.config/hypr/config/colors.conf

# Rounded corners and a soft shadow, matching the floating waybar pills.
decoration {
    active_opacity = 1
    rounding = 12
    rounding_power = 3
    blur {
        enabled = false
    }
    shadow {
        enabled = true
        range = 18
        render_power = 3
        offset = 0 4
        color = $shadowcolor
    }
}
