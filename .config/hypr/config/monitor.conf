# Every main screen sits in the same slot (0x0) and is 1440 tall, so the rest of
# the layout (laptop position, workspace pinning) is identical wherever I dock.
#
# Rules are evaluated last-match-wins, so the bare fallback below is the generic
# case and the `desc:` rules after it are the per-display overrides.

# any other screen (fallback)
monitor = , preferred, 0x0, 1

# Home monitor: Samsung Odyssey G85SD, 3440x1440 ultrawide, over HDMI.
#
# Matched by description rather than port name, same as the Philips rule below,
# so it keeps its mode on whichever output it lands (HDMI-A-1 at home today, a
# dock-assigned DP output otherwise).
#
# 3440x1440@59.96 is the mode known to light the panel. The EDID also offers
# 3440x1440@99.96, which is UNTESTED on a healthy link: the one attempt so far
# (2026-09-17) was made while the DMCUB display firmware had failed to load (the
# linux-firmware-amdgpu 20260910-1 regression on Rembrandt, see below), so the
# `Connector HDMI-A-1 disconnected` that followed says nothing about the cable
# or port. Retry 99.96 only with a clean `journalctl -k | grep DMUB`, and judge
# it by looking at the panel: `hyprctl monitors` reporting a mode only means
# DRM accepted the request, not that the panel locked. Same trap as the Philips
# below. If it still fails on a healthy link, the next suspect is HDMI 1.4
# bandwidth (100 Hz needs roughly 12.8 Gbps, HDMI 1.4 carries about 8.2).
#
# "No signal" on HDMI while eDP-1 works is usually not this file. Check the
# display firmware first:
#   journalctl -k -b 0 | grep -E "DMUB|DMCUB"
# "failed to load ucode DMCUB" or "Error getting DMUB FW meta info" means the
# DMCUB microcontroller (yellow_carp_dmcub.bin for the Radeon 680M) did not
# load. eDP is brought up by the VBIOS and survives that; HDMI link training
# does not. Fix the firmware/kernel, not the monitor rule.
#
# VRR is not set here; the global `misc:vrr = 2` (fullscreen only) in
# variables.conf covers it. Hyprland logged this connector's CRTC as
# `incapable of vrr` while DMCUB was down; unverified on a healthy link.
monitor = desc:Samsung Electric Company Odyssey G85SD, 3440x1440@59.96Hz, 0x0, 1

# No generic `DP-1, ...` rule on purpose. Any 3440x1440 ultrawide on DisplayPort
# (e.g. the Dell P3424WEB) is served correctly by the `, preferred` fallback
# above. A port-name rule here would also match the Philips below and get
# overridden by its `desc:` rule, costing an extra DP link training on every
# connect - and on a dock-shared cable a redundant train is a chance to drop.

# Philips 499P9 (49" 32:9 superwide). Matched by description rather than port so
# it keeps its native mode on whichever DP output the dock hands it.
#
# Connected over USB-C, which is also carrying the monitor's built-in USB 3 hub
# (gigabit ethernet enumerates as SuperSpeed Plus). That leaves DP alt-mode only
# 2 lanes. Measured behaviour: 2 lanes at HBR2 = 8.6 Gbps of payload.
#
# 5120x1440@60 needs ~11.1 Gbps (462 MHz pixel clock, 8bpc RGB), so it does NOT
# fit. Requesting it anyway is worse than useless: the panel still answers the
# EDID handshake, so DRM reports `connected` + `dpms On` while the panel never
# achieves lock and sits in standby. It also wedged the display controller
# (amdgpu REG_WAIT timeout in dcn31_program_compbuf_size), which took the shared
# USB tree down with it and made the whole link re-enumerate in a loop.
#
# The panel itself is not the limit - its EDID range block allows 600 MHz pixel
# clock and 48-75 Hz. DSC is not an option: the DisplayID block is v1.2 with no
# Interface Features block, so no DSC is advertised.
#
# So @29.98 is the honest ceiling for native resolution on a 2-lane link.
# To get 5120x1440@60 the link needs 4 DP lanes, which means one of:
#   - monitor OSD: set the USB-C option to favour resolution over USB data
#     rate, dropping the built-in hub to USB 2.0 (costs gigabit ethernet speed)
#   - drive video over the monitor's DisplayPort input with its own cable and
#     leave USB-C for data only (keeps both, needs a second cable)
#
# Alternative if 60 Hz matters more than pixels: 3840x1080@59.97Hz, which is
# EDID-advertised, still 32:9, and fits the 2-lane budget.
#
# Verify the negotiated link any time with:
#   sudo cat /sys/kernel/debug/dri/1/DP-1/link_settings
monitor = desc:Philips Consumer Electronics Company PHL 499P9, 5120x1440@29.98, 0x0, 1

# built-in notebook screen (left of main, bottom edges aligned: 1440 - 1200 = 240)
monitor = eDP-1, preferred, -1920x240, 1
# monitor = eDP-1, preferred, 3440x0, 1   # right of a 3440-wide main

# If you need to scale things like steam etc, please uncomment these lines.
# Adjust GDK_SCALE accordingly to your liking.
#xwayland {
#  force_zero_scaling = true       # Unscale XWayland
#}

#env = GDK_SCALE, 1.25                   # GDK Scaling Factor
